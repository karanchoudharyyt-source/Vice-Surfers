<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1046">
<title>Vice Surfers</title>
<meta name="description" content="An endless 3D run down a sunset Ocean Drive with five stars on your tail.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌴</text></svg>">
<style>
@font-face { font-family: 'Anton'; src: url('assets/fonts/anton.woff2') format('woff2'); font-display: block; }
@font-face { font-family: 'Mr Dafoe'; src: url('assets/fonts/mrdafoe.woff2') format('woff2'); font-display: block; }
@font-face { font-family: 'Rubik'; src: url('assets/fonts/rubik.woff2') format('woff2'); font-weight: 300 900; font-display: block; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1046; touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none; font-family: Rubik, system-ui, sans-serif; }
canvas#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: fixed; inset: 0; pointer-events: none; padding: max(14px, env(safe-area-inset-top)) 16px 16px; }
.hidden { display: none !important; }
.num { font-family: Anton, Impact, sans-serif; color: #fff; letter-spacing: 1px; -webkit-text-stroke: 1.5px #000; paint-order: stroke fill; text-shadow: 0 3px 0 rgba(0,0,0,.45); }
#score { position: absolute; left: 16px; top: max(12px, env(safe-area-inset-top)); font-size: clamp(34px, 9vw, 54px); line-height: 1; }
#dist { position: absolute; left: 18px; top: calc(max(12px, env(safe-area-inset-top)) + clamp(40px, 10.5vw, 62px)); font-size: clamp(14px, 3.6vw, 20px); color: #ffe7f3; }
#mult { position: absolute; left: 16px; top: calc(max(12px, env(safe-area-inset-top)) + clamp(64px, 16.5vw, 96px)); font: 900 clamp(13px, 3.4vw, 17px) Rubik, sans-serif; color: #fff; background: linear-gradient(90deg, #ff3f8e, #ff8a3d); padding: 3px 10px; border-radius: 99px; box-shadow: 0 2px 0 rgba(0,0,0,.35); }
#right { position: absolute; right: 14px; top: max(12px, env(safe-area-inset-top)); text-align: right; }
#stars { font-size: clamp(26px, 7.4vw, 40px); line-height: 1; letter-spacing: 2px; }
#stars span { color: rgba(255,255,255,.34); -webkit-text-stroke: 1.5px rgba(0,0,0,.55); display: inline-block; transition: transform .2s; }
#stars span.on { color: #fff; -webkit-text-stroke: 1.6px #000; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
#stars span.flash { animation: starflash .5s steps(2) infinite; }
@keyframes starflash { 0% { color: #fff; } 50% { color: rgba(255,255,255,.2); } }
#cash { font-size: clamp(26px, 7.4vw, 42px); color: #72e06a; -webkit-text-stroke: 1.6px #0b2a0b; margin-top: 4px; }
#cash.pop { animation: pop .25s ease-out; }
@keyframes pop { 0% { transform: scale(1.18); } 100% { transform: scale(1); } }
#pause { position: absolute; left: 50%; top: max(14px, env(safe-area-inset-top)); transform: translateX(-50%); width: 40px; height: 40px; border-radius: 50%; border: 2px solid rgba(255,255,255,.75); background: rgba(20,10,40,.25); color: #fff; font: 900 16px Rubik; pointer-events: auto; }
#banner { position: absolute; left: 0; right: 0; top: 24%; text-align: center; font-size: clamp(28px, 8vw, 48px); opacity: 0; }
#banner.show { animation: banner 1.6s ease-out forwards; }
@keyframes banner { 0% { opacity: 0; transform: scale(1.6); } 12% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-20px); } }
#banner.wanted { color: #fff; }
/* title */
#title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: max(9vh, env(safe-area-inset-top)) 20px max(7vh, env(safe-area-inset-bottom)); pointer-events: none; }
.logo { text-align: center; line-height: .8; transform: rotate(-6deg); }
.logo .vice { font-family: 'Mr Dafoe', cursive; font-size: clamp(96px, 30vw, 170px); color: #ff5fb3; text-shadow: 0 0 6px #fff, 0 0 18px #ff3fa4, 0 0 40px #ff3fa4, 0 4px 0 #6a0f45; display: block; }
.logo .surf { font-family: Anton, Impact, sans-serif; font-size: clamp(46px, 14.5vw, 84px); letter-spacing: 3px; display: block; margin-top: -6px; font-style: italic;
  background: linear-gradient(180deg, #ffffff 0%, #9ff6ff 38%, #22b9d8 52%, #ffffff 56%, #ffb3dd 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  -webkit-text-stroke: 2px #2a0b4a; filter: drop-shadow(0 4px 0 #2a0b4a) drop-shadow(0 0 16px rgba(56,243,255,.6)); }
.tag { margin-top: 18px; font: 700 clamp(11px, 3.1vw, 16px) Rubik; color: #fff; letter-spacing: clamp(1.5px, .7vw, 3px); white-space: nowrap; text-transform: uppercase; text-shadow: 0 2px 6px rgba(0,0,0,.5); text-align: center; }
.bottom { display: flex; flex-direction: column; align-items: center; gap: 14px; }
#playBtn, #again { pointer-events: auto; border: 0; border-radius: 99px; padding: 16px 46px; font: 400 clamp(24px, 7vw, 32px) Anton, sans-serif; letter-spacing: 2px; color: #fff; background: linear-gradient(90deg, #ff3f8e, #ff8a3d); box-shadow: 0 6px 0 #8a1c4a, 0 10px 30px rgba(255,63,142,.5); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }
.hint { font: 600 clamp(12px, 3.3vw, 14px) Rubik; color: rgba(255,255,255,.9); text-shadow: 0 1px 4px rgba(0,0,0,.6); text-align: center; line-height: 1.5; }
.best { font: 800 14px Rubik; color: #ffe066; letter-spacing: 2px; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
/* wasted / busted */
#dead { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; transition: transform .5s ease-out; }
#dead.up { transform: translateY(-19vh); }
#dead .word { font-family: Anton, Impact, sans-serif; font-size: clamp(74px, 22vw, 130px); color: #c8171c; -webkit-text-stroke: 3px #000; paint-order: stroke fill; letter-spacing: 4px; text-shadow: 0 6px 0 rgba(0,0,0,.5); animation: wasted 2.2s ease-out forwards; }
#dead.busted .word { color: #3d6cff; }
@keyframes wasted { 0% { opacity: 0; transform: scale(1.5); letter-spacing: 30px; } 20% { opacity: 1; transform: scale(1); letter-spacing: 4px; } 100% { opacity: 1; transform: scale(1.04); } }
#over { position: fixed; left: 50%; bottom: max(8vh, env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(88vw, 380px); background: rgba(20,10,40,.72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 2px solid rgba(255,255,255,.15); border-radius: 22px; padding: 18px 20px 22px; text-align: center; pointer-events: auto; animation: rise .5s ease-out; }
@keyframes rise { 0% { opacity: 0; transform: translate(-50%, 40px); } 100% { opacity: 1; transform: translate(-50%, 0); } }
#over .row { display: flex; justify-content: space-between; font: 700 16px Rubik; color: #fff; padding: 6px 2px; border-bottom: 1px solid rgba(255,255,255,.08); }
#over .row b { font-family: Anton; font-weight: 400; font-size: 22px; letter-spacing: 1px; }
#over .row.cashrow b { color: #72e06a; }
#over .new { color: #ffe066; font: 900 14px Rubik; letter-spacing: 3px; margin: 8px 0 2px; }
#again { margin-top: 14px; font-size: 26px; padding: 12px 36px; }
#loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: radial-gradient(ellipse at 50% 70%, #ff7a59 0%, #c2357d 35%, #2a0f55 75%); z-index: 5; }
#loading .logo { transform: rotate(-6deg) scale(.8); }
#bar { width: min(70vw, 300px); height: 10px; border-radius: 99px; background: rgba(255,255,255,.2); overflow: hidden; }
#bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #38f3ff, #ff3fa4); transition: width .2s; }
#loadTxt { font: 700 13px Rubik; color: #fff; letter-spacing: 3px; }
#flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
</style>
<script type="importmap">{ "imports": { "three": "./vendor_three/three.module.js", "three/addons/": "./vendor_jsm/" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud hidden" id="hud">
  <div id="score" class="num">0</div>
  <div id="dist" class="num">0 m</div>
  <div id="mult">×1</div>
  <div id="right"><div id="stars" class="num"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div><div id="cash" class="num">$00000000</div></div>
  <button id="pause" aria-label="Pause">II</button>
  <div id="banner" class="num"></div>
</div>
<div id="title" class="hidden">
  <div><div class="logo"><span class="vice">Vice</span><span class="surf">SURFERS</span></div><div class="tag">Ocean Drive · Sunset · Five Stars</div></div>
  <div class="bottom">
    <button id="playBtn">TAP TO RUN</button>
    <div class="hint" id="hint">Swipe ← → to switch lanes · ↑ jump · ↓ roll</div>
    <div class="best" id="best"></div>
  </div>
</div>
<div id="dead" class="hidden"><div class="word">WASTED</div></div>
<div id="over" class="hidden">
  <div class="new hidden" id="newBest">NEW BEST</div>
  <div class="row"><span>Score</span><b id="oScore">0</b></div>
  <div class="row cashrow"><span>Cash</span><b id="oCash">$0</b></div>
  <div class="row"><span>Distance</span><b id="oDist">0 m</b></div>
  <div class="row"><span>Wanted</span><b id="oStars">★</b></div>
  <button id="again">RUN AGAIN</button>
</div>
<div id="flash"></div>
<div id="loading"><div class="logo"><span class="vice">Vice</span><span class="surf">SURFERS</span></div><div id="bar"><i></i></div><div id="loadTxt">LOADING</div></div>
<script type="module" src="./js/main.js"></script>
</body>
</html>
